name: Audit fezabilitate

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependente
        run: pip install numpy pandas requests

      - name: Ruleaza auditul (date reale Wikimedia)
        run: python audit_fezabilitate.py --nsim 500 2>&1 | tee audit_output.txt

      - name: Salveaza rezultatul
        uses: actions/upload-artifact@v4
        with:
          name: audit_output
          path: audit_output.txt
